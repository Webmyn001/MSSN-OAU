version: '3.9'

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mssnoau-api
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bun", "run", "--bun", "-e", "fetch('http://localhost:3000').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - mssnoau-network

  db:
    image: pgvector/pgvector:16-pg16
    container_name: mssnoau-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mssn_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - mssnoau-network
    restart: unless-stopped

networks:
  mssnoau-network:
    driver: bridge

volumes:
  pgdata:


