name: Deploy marketing site

on:
  push:
    branches:
      - main
    paths:
      - "marketing-react/**"
  workflow_dispatch:

concurrency:
  group: deploy-marketing-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Build and publish marketing site
    runs-on: ubuntu-latest

    steps:
      - name: Check out source repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: marketing-react/package-lock.json

      - name: Install dependencies
        working-directory: marketing-react
        run: npm ci

      - name: Type check
        working-directory: marketing-react
        run: npm run typecheck

      - name: Build production SSR bundle
        working-directory: marketing-react
        env:
          VITE_API_BASE_URL: https://mssn-api.onrender.com
          VERCEL: ""
        run: npm run build

      - name: Verify build output
        working-directory: marketing-react
        run: |
          test -f build/server/index.js
          test -d build/client
          test -f build/client/robots.txt

      - name: Create deploy staging
        working-directory: marketing-react
        run: |
          rm -rf deploy
          mkdir -p deploy/build
          cp -R build/client deploy/build/client
          cp ../.github/deploy/marketing/server-entry.mjs .deploy-server-entry.mjs
          cp ../.github/deploy/marketing/bundle.mjs .deploy-bundle.mjs
          node .deploy-bundle.mjs
          rm -f .deploy-server-entry.mjs .deploy-bundle.mjs

      - name: Verify deploy output
        working-directory: marketing-react
        run: |
          test -f deploy/server.mjs
          test -f deploy/build/client/robots.txt
          test -d deploy/build/client/assets
          if find deploy -type f | grep -Eq '/(package\.json|package-lock\.json|node_modules|\.env)'; then
            echo "Deploy output contains source or dependency files that must not be published." >&2
            exit 1
          fi

      - name: Publish to MSSN-OAU-WEBSITE
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          external_repository: Webmyn001/MSSN-OAU-WEBSITE
          publish_branch: main
          publish_dir: marketing-react/deploy
          force_orphan: true
          enable_jekyll: false
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: "chore: deploy marketing build from ${{ github.repository }}@${{ github.sha }}"
