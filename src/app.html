<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="theme-color" content="#003a1c">
		<link rel="icon" href="%sveltekit.assets%/favicon.ico" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="description" content="Muslim Students Society of Nigeria, Obafemi Awolowo University Branch">
		
		<!-- Cache Control -->
		<meta http-equiv="Cache-Control" content="max-age=86400" />
		
		<!-- Security Headers - Allow required resources -->
		<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob: https://cdn.jsdelivr.net https://va.vercel-scripts.com https://randomuser.me 'unsafe-inline' 'unsafe-eval'; style-src 'self' https://cdn.jsdelivr.net https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com https://annuurpress.org.ng https://secure.gravatar.com https://plus.unsplash.com https://api.mssnoau.com https://*.cloudinary.com https://randomuser.me; font-src 'self' https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' https://api.mssnoau.com https://api.aladhan.com https://va.vercel-scripts.com;">
		<meta http-equiv="X-Content-Type-Options" content="nosniff" />
		
		<!-- Performance Optimizations -->
		<meta name="color-scheme" content="light dark">
		<link rel="preload" as="font" href="https://cdn.jsdelivr.net/fontsource/fonts/mulish:vf@latest/latin-wght-normal.woff2" type="font/woff2" crossorigin="anonymous" />
		
		<!-- Preconnect to domains -->
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
		<link rel="preconnect" href="https://images.unsplash.com" crossorigin>
		<link rel="preconnect" href="https://annuurpress.org.ng" crossorigin>
		<link rel="preconnect" href="https://api.aladhan.com" crossorigin>
		<link rel="preconnect" href="https://va.vercel-scripts.com" crossorigin>
		
		<!-- DNS prefetch for performance -->
		<link rel="dns-prefetch" href="https://images.unsplash.com">
		<link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
		<link rel="dns-prefetch" href="https://annuurpress.org.ng">
		<link rel="dns-prefetch" href="https://api.aladhan.com">
		<link rel="dns-prefetch" href="https://va.vercel-scripts.com">
		
		<!-- Preload critical assets with fetchpriority -->
		<link rel="preload" href="%sveltekit.assets%/mssn-logo.webp" as="image" fetchpriority="high" />
		
		<!-- PWA Support -->
		<link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.webp" />
		<link rel="manifest" href="/app.webmanifest" />
		
		<!-- Critical CSS for initial render -->
		<style>
			/* Critical CSS for above-the-fold content */
			:root {
				--background: 0 0% 100%;
				--foreground: 0 0% 3.9%;
				--primary: 0 0% 9%;
				--primary-foreground: 0 0% 98%;
			}
			
			body {
				margin: 0;
				font-family: 'Mulish Variable', system-ui, -apple-system, sans-serif;
				background-color: hsl(var(--background));
				color: hsl(var(--foreground));
				text-rendering: optimizeSpeed;
				-webkit-font-smoothing: antialiased;
			}
			
			html {
				scroll-behavior: smooth;
				/* Add content-visibility to improve paint performance */
				content-visibility: auto;
			}
			
			.container {
				width: 100%;
				margin-left: auto;
				margin-right: auto;
				padding-left: 1rem;
				padding-right: 1rem;
				box-sizing: border-box;
			}
			
			@media (min-width: 640px) {
				.container {
					max-width: 640px;
				}
			}
			
			@media (min-width: 768px) {
				.container {
					max-width: 768px;
				}
			}
			
			@media (min-width: 1024px) {
				.container {
					max-width: 1024px;
				}
			}
			
			@media (min-width: 1280px) {
				.container {
					max-width: 1280px;
				}
			}
			
			/* Font loading optimization */
			@font-face {
				font-family: 'Mulish Variable';
				font-style: normal;
				font-display: swap;
				font-weight: 200 1000;
				src: url(https://cdn.jsdelivr.net/fontsource/fonts/mulish:vf@latest/latin-wght-normal.woff2) format('woff2-variations');
				unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+2074,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
			}
			
			/* Initial content placeholder styles */
			.content-placeholder {
				opacity: 0;
				animation: fadeIn 0.5s ease-in-out forwards;
				animation-delay: 0.1s;
			}
			
			@keyframes fadeIn {
				from { opacity: 0; }
				to { opacity: 1; }
			}
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents" class="content-placeholder">%sveltekit.body%</div>
		<!-- No render-blocking scripts here -->
	</body>
</html>
