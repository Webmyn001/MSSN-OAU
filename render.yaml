# * Render Blueprint — MSSN OAU API (database hosted on Neon — permanent free tier, no expiry)
# * Deploy: push this file, then in Render dashboard:
# *   New -> Blueprint -> select repo -> fill in the sync:false secrets (incl. Neon DATABASE_URL) -> Apply
# * Blueprint schema: https://render.com/schema/render.yaml.json
# * Uses Render's native runtime (Bun ships with the Node runtime) — no Docker needed.

services:
  - type: web
    name: mssn-api
    runtime: node
    rootDir: api
    plan: free
    region: frankfurt
    healthCheckPath: /health
    # Bun ships with Render's native Node runtime
    buildCommand: bun install --frozen-lockfile
    # Applies Drizzle migrations, then starts the server (free tier has no preDeployCommand or Shell)
    startCommand: bun run db:migrate && bun run start
    envVars:
      # Non-secret / static config
      - key: NODE_ENV
        value: production
      - key: BUN_VERSION
        value: 1.3.14
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "2525"
      - key: SMTP_SECURE
        value: "false"
      - key: SMTP_USER
        value: ab5e9b001@smtp-brevo.com

      # You'll paste your Neon connection string here during Blueprint creation
      - key: DATABASE_URL
        sync: false

      # Render generates a random secret for JWT signing
      - key: JWT_SECRET
        generateValue: true

      # Public frontend URL — used for CORS, password-reset links and manager
      # activation links. No trailing slash (link builders append paths).
      - key: APP_URL
        value: https://www.mssnoau.org
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_BUCKET_NAME
        sync: false
      - key: SMTP_PASS
        sync: false
      # Must be a sender verified in the Brevo account, otherwise Brevo rejects
      # emails with "451 4.0.0 Invalid from". bellomuhyideen0001@gmail.com is
      # verified and works.
      - key: SMTP_FROM
        value: "MSSN OAU <bellomuhyideen0001@gmail.com>"
      - key: KUDISMS_API_TOKEN
        sync: false
      - key: KUDISMS_SENDER_ID
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_UPLOAD_PRESET
        sync: false

      # Al Mamharah — bootstraps the primary Programme Manager on the first
      # login attempt, but only while no PRIMARY manager row exists yet.
      # Password must be at least 8 characters.
      - key: AL_MAMHARAH_MANAGER_EMAIL
        sync: false
      - key: AL_MAMHARAH_MANAGER_PASSWORD
        sync: false
      # Dedicated secret for manager JWTs (falls back to JWT_SECRET when unset).
      - key: AL_MAMHARAH_MANAGER_JWT_SECRET
        generateValue: true
      # Public site URL used to build manager activation links.
      - key: AL_MAMHARAH_SITE_URL
        value: https://www.mssnoau.org

  # * MSSN OAU Admin Dashboard (React Router v7 SPA — Render static site)
  # * VITE_API_BASE_URL is baked into the JS bundle at build time, so any change
  # * to the API URL requires a rebuild (set it as a build-time env var).
  - type: web
    name: mssn-dashboard
    runtime: static
    rootDir: dashboard-react
    # npm ci can fail cross-platform (the Windows-generated lockfile can lack the
    # linux-x64 optional binaries), so use npm install; --include=dev is required
    # because Render sets NODE_ENV=production which would omit the Vite tooling.
    buildCommand: npm install --no-audit --no-fund --include=dev && npm run build
    staticPublishPath: ./build/client
    # SPA fallback: serve index.html for client-side routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE_URL
        value: https://mssn-api.onrender.com
